<title>Prime Sports Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#f6f3ec;--s1:#fffdf8;--s2:#eee8da;--tx:#14201c;--mu:#5f6a64;--bd:#ddd5c3;--pri:#0f3d33;--pt:#f6f3ec;--acc:#a77d33;--ok:#1f7a4d;--er:#c0392b;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1512;--s1:#111e19;--s2:#18291f;--tx:#eee9dc;--mu:#9aa89f;--bd:#26382f;--pri:#d9b56a;--pt:#0b1512;--acc:#d9b56a;--ok:#4cc38a;--er:#ff7b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1512;--s1:#111e19;--s2:#18291f;--tx:#eee9dc;--mu:#9aa89f;--bd:#26382f;--pri:#d9b56a;--pt:#0b1512;--acc:#d9b56a;--ok:#4cc38a;--er:#ff7b6b;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(84px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.65;transition:background .3s,color .3s;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:70}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,.serif{font-family:"Playfair Display",Georgia,serif;font-weight:600;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.nav{display:flex;align-items:center;gap:10px;height:72px}
.logo{display:flex;flex-direction:column;line-height:1;margin-right:auto}
.logo b{font-family:"Playfair Display",Georgia,serif;font-size:1.65rem;letter-spacing:.22em;font-weight:700}
.logo small{font-size:.6rem;letter-spacing:.42em;color:var(--acc);margin-top:5px;font-weight:600}
.links{display:flex;gap:2px}
.links a{padding:8px 13px;font-size:.92rem;font-weight:500;color:var(--mu);border-bottom:1px solid transparent;transition:.2s}
.links a:hover,.links a.on{color:var(--tx);border-color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border:1px solid var(--bd);background:transparent;border-radius:999px;font-weight:600;font-size:.92rem;transition:.2s;position:relative}
.btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.btn.pri{background:var(--pri);color:var(--pt);border-color:var(--pri)}
.btn.lg{padding:14px 30px;font-size:1rem}.btn.w{width:100%}
.btn.ic{width:42px;height:42px;padding:0}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:var(--pt);font-size:.68rem;display:grid;place-items:center;padding:0 4px}
.badge:empty{display:none}
.burger{display:none}
.hero{padding:96px 0 80px}
.hg{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
.eyebrow{font-size:.74rem;letter-spacing:.3em;text-transform:uppercase;color:var(--acc);font-weight:700}
h1{font-size:clamp(2.6rem,6vw,4.8rem);line-height:1.04;margin:16px 0 20px}
h1 em{font-style:italic;color:var(--acc)}
.lead{color:var(--mu);font-size:1.12rem;max-width:520px;margin:0 0 32px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:44px;margin-top:52px;padding-top:28px;border-top:1px solid var(--bd)}
.stats b{display:block;font-family:"Playfair Display",serif;font-size:2.3rem;font-weight:600}
.stats small{color:var(--mu);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase}
.art{border:1px solid var(--bd);border-radius:24px;background:var(--s1);padding:26px;color:var(--acc)}
section{padding:88px 0}.alt{background:var(--s2)}
h2{font-size:clamp(1.9rem,4vw,2.9rem);margin:8px 0 10px}
.sub{color:var(--mu);max-width:560px;margin:0 0 34px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.chip{padding:8px 20px;border-radius:999px;border:1px solid var(--bd);background:transparent;font-weight:600;font-size:.88rem;transition:.2s}
.chip.on{background:var(--pri);color:var(--pt);border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:.25s}
.card:hover{transform:translateY(-4px);border-color:var(--acc)}
.th{height:140px;display:grid;place-items:center;background:var(--s2);color:var(--acc);border-bottom:1px solid var(--bd)}
.th .mono{font-family:"Playfair Display",serif;font-size:3.6rem;opacity:.9}
.cb{padding:20px;display:flex;flex-direction:column;gap:8px;flex:1}
.cb h3{margin:0;font-size:1.2rem}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:.88rem}
.price{font-weight:700;color:var(--tx)}
.cb .btn{margin-top:auto}
.more{max-height:0;overflow:hidden;transition:max-height .35s;color:var(--mu);margin:0}.more.open{max-height:220px}
details{border-bottom:1px solid var(--bd);padding:16px 0}summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";color:var(--acc);font-size:1.3rem;line-height:1}details[open] summary::after{content:"\2212"}
details p{color:var(--mu);margin:10px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px}
form,.box{background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:26px;display:grid;gap:14px}
label{display:grid;gap:6px;font-weight:600;font-size:.86rem}
input,textarea,select{font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
input:focus,textarea:focus,select:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.err{color:var(--er);font-size:.8rem;font-weight:500;min-height:1em}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
footer{border-top:1px solid var(--bd);padding:34px 0;color:var(--mu);font-size:.88rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
dialog{border:1px solid var(--bd);border-radius:22px;background:var(--s1);color:var(--tx);padding:28px;width:min(500px,94vw);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(4,10,8,.62);backdrop-filter:blur(3px)}
dialog.dr{margin:0 0 0 auto;height:100%;max-height:100%;width:min(440px,100%);border-radius:0;border-width:0 0 0 1px}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.dh h3{margin:0;font-size:1.5rem}
.tabs{display:flex;border-bottom:1px solid var(--bd);margin-bottom:20px}
.tab{flex:1;padding:10px;background:none;border:0;border-bottom:2px solid transparent;font-weight:600;color:var(--mu)}.tab.on{color:var(--tx);border-color:var(--acc)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
.pill{padding:8px 13px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);font-weight:600;font-size:.86rem}
.pill.on{background:var(--pri);color:var(--pt);border-color:var(--pri)}.pill:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd);font-size:.92rem}
.li small{color:var(--mu);display:block}
.tot{display:flex;justify-content:space-between;padding:5px 0;color:var(--mu)}.tot.g{color:var(--tx);font-weight:700;font-size:1.15rem;border-top:1px solid var(--bd);margin-top:8px;padding-top:12px}
.qty{display:inline-flex;align-items:center;gap:8px}.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--bd);background:none;padding:0}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.opt{padding:12px 6px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);font-weight:600;font-size:.86rem}.opt.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.note{font-size:.8rem;color:var(--mu);background:var(--s2);border-radius:10px;padding:10px 12px}
.ok{color:var(--ok);font-weight:700}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140px);background:var(--tx);color:var(--bg);padding:12px 24px;border-radius:999px;font-weight:600;font-size:.92rem;z-index:200;transition:transform .35s;max-width:92vw}#toast.show{transform:translate(-50%,0)}
.rv{opacity:0;transform:translateY(22px);transition:.8s}.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
@media (max-width:900px){.hg,.two{grid-template-columns:1fr}.burger{display:inline-flex}.links{position:absolute;top:72px;left:0;right:0;flex-direction:column;background:var(--bg);padding:10px 24px;border-bottom:1px solid var(--bd);display:none}.links.open{display:flex}.stats{gap:26px}}
</style>
</head>
<body>
<header><div class="wrap nav">
  <a href="#home" class="logo"><b>PRIME</b><small>SPORTS CLUB</small></a>
  <nav class="links" id="links">
    <a href="#home" data-i="n_home"></a><a href="#courts" data-i="n_courts"></a><a href="#shop" data-i="n_shop"></a><a href="#community" data-i="n_com"></a><a href="#blog" data-i="n_blog"></a><a href="#support" data-i="n_sup"></a>
  </nav>
  <button class="btn" id="langBtn" aria-label="Language"><span data-ic="globe"></span><span id="langL">ES</span></button>
  <button class="btn ic" id="themeBtn" aria-label="Theme"></button>
  <button class="btn ic" id="cartBtn" aria-label="Cart"><span data-ic="bag"></span><span class="badge" id="cartN"></span></button>
  <button class="btn pri" id="userBtn"></button>
  <button class="btn ic burger" id="burger" aria-label="Menu"><span data-ic="menu"></span></button>
</div></header>

<main>
<section class="hero" id="home"><div class="wrap hg">
  <div>
    <span class="eyebrow" data-i="eyebrow"></span>
    <h1><span data-i="h1a"></span> <em data-i="h1b"></em></h1>
    <p class="lead" data-i="lead"></p>
    <div class="row"><a href="#courts" class="btn pri lg" data-i="cta1"></a><a href="#shop" class="btn lg" data-i="cta2"></a></div>
    <div class="stats"><div><b data-n="12">0</b><small data-i="s1"></small></div><div><b data-n="2400">0</b><small data-i="s2"></small></div><div><b data-n="180">0</b><small data-i="s3"></small></div></div>
  </div>
  <div class="art" id="heroArt"></div>
</div></section>

<section id="courts" class="alt"><div class="wrap rv">
  <span class="eyebrow" data-i="n_courts"></span><h2 data-i="c_t"></h2><p class="sub" data-i="c_s"></p>
  <div class="chips" id="cChips"></div><div class="grid" id="cGrid"></div>
</div></section>

<section id="shop"><div class="wrap rv">
  <span class="eyebrow" data-i="n_shop"></span><h2 data-i="sh_t"></h2><p class="sub" data-i="sh_s"></p>
  <div class="chips" id="pChips"></div><div class="grid" id="pGrid"></div>
</div></section>

<section id="community" class="alt"><div class="wrap rv">
  <span class="eyebrow" data-i="n_com"></span><h2 data-i="com_t"></h2><p class="sub" data-i="com_s"></p>
  <div class="grid" id="eGrid"></div>
</div></section>

<section id="blog"><div class="wrap rv">
  <span class="eyebrow" data-i="n_blog"></span><h2 data-i="bl_t"></h2><p class="sub" data-i="bl_s"></p>
  <div class="grid" id="bGrid"></div>
</div></section>

<section id="support" class="alt"><div class="wrap rv">
  <span class="eyebrow" data-i="n_sup"></span><h2 data-i="su_t"></h2><p class="sub" data-i="su_s"></p>
  <div class="two">
    <div id="faq"></div>
    <form id="tForm" novalidate>
      <div class="f2"><label><span data-i="f_name"></span><input name="n" autocomplete="name"><span class="err"></span></label>
      <label><span data-i="f_mail"></span><input name="e" type="email" autocomplete="email"><span class="err"></span></label></div>
      <label><span data-i="f_topic"></span><select name="t" id="topicSel"></select><span class="err"></span></label>
      <label><span data-i="f_msg"></span><textarea name="m" rows="4"></textarea><span class="err"></span></label>
      <button class="btn pri lg" type="submit" data-i="f_send"></button>
    </form>
  </div>
</div></section>
</main>
<footer class="wrap"><span>&copy; 2026 Prime Sports Club</span><span data-i="foot"></span></footer>

<dialog id="bookDlg"><div class="dh"><h3 id="bkT"></h3><button class="btn ic" data-close aria-label="Close"><span data-ic="x"></span></button></div>
  <b data-i="b_day"></b><div class="pills" id="days"></div><b data-i="b_time"></b><div class="pills" id="slots"></div>
  <button class="btn pri lg w" id="bkOk" data-i="b_add"></button></dialog>

<dialog id="cartDlg" class="dr"><div class="dh"><h3 data-i="cart_t"></h3><button class="btn ic" data-close aria-label="Close"><span data-ic="x"></span></button></div><div id="cartBody"></div></dialog>

<dialog id="authDlg"><div class="dh"><h3 id="authT"></h3><button class="btn ic" data-close aria-label="Close"><span data-ic="x"></span></button></div>
  <div class="tabs" id="authTabs"><button class="tab on" data-tab="in" data-i="signin"></button><button class="tab" data-tab="up" data-i="signup"></button></div>
  <p class="note" id="authNote" hidden></p>
  <form id="fIn" novalidate style="border:0;padding:0">
    <label><span data-i="f_mail"></span><input name="e" type="email" autocomplete="email"><span class="err"></span></label>
    <label><span data-i="f_pass"></span><input name="p" type="password" autocomplete="current-password"><span class="err"></span></label>
    <button class="btn pri lg" type="submit" data-i="signin"></button>
    <button class="btn" type="button" id="forgot" data-i="forgot"></button>
  </form>
  <form id="fUp" novalidate style="border:0;padding:0" hidden>
    <label><span data-i="f_name"></span><input name="n" autocomplete="name"><span class="err"></span></label>
    <label><span data-i="f_mail"></span><input name="e" type="email" autocomplete="email"><span class="err"></span></label>
    <div class="f2"><label><span data-i="f_pass"></span><input name="p" type="password" autocomplete="new-password"><span class="err"></span></label>
    <label><span data-i="f_pass2"></span><input name="q" type="password" autocomplete="new-password"><span class="err"></span></label></div>
    <button class="btn pri lg" type="submit" data-i="signup"></button>
  </form>
</dialog>

<dialog id="coDlg"><div class="dh"><h3 data-i="co_t"></h3><button class="btn ic" data-close aria-label="Close"><span data-ic="x"></span></button></div><div id="coBody"></div></dialog>
<dialog id="accDlg"><div class="dh"><h3 data-i="acc_t"></h3><button class="btn ic" data-close aria-label="Close"><span data-ic="x"></span></button></div><div id="accBody"></div></dialog>
<div id="toast" role="status"></div>

$("#userBtn").onclick=()=>{if(user()){rAcc();$("#accDlg").showModal()}else{pend=false;needAuth("")}};
$("#burger").onclick=()=>$("#links").classList.toggle("open");
$("#fIn").onsubmit=e=>{e.preventDefault();const f=e.target;if(!val(f,[["e",ml],["p",rq]]))return;const u=DB.users.find(x=>x.e===f.e.value.trim().toLowerCase()&&x.h===hs(f.p.value));if(!u){f.p.parentElement.querySelector(".err").textContent=t("e_bad");return}f.reset();login(u)};
$("#fUp").onsubmit=e=>{e.preventDefault();const f=e.target;if(!val(f,[["n",rq],["e",ml],["p",pw],["q",(v,f)=>v!==f.p.value?"e_match":""]]))return;const em=f.e.value.trim().toLowerCase();if(DB.users.some(x=>x.e===em)){f.e.parentElement.querySelector(".err").textContent=t("e_dup");return}const u={n:f.n.value.trim(),e:em,h:hs(f.p.value)};DB.users.push(u);f.reset();toast(t("t_up"));login(u)};
$("#forgot").onclick=()=>{const v=$("#fIn").e.value.trim();if(!v)return toast(t("t_mail"));toast(t("t_rst"))};
$("#tForm").onsubmit=e=>{e.preventDefault();const f=e.target;if(!val(f,[["n",rq],["e",ml],["m",rq]]))return;const tk={id:"TK-"+Math.floor(1000+Math.random()*9000),u:f.e.value.trim().toLowerCase(),t:f.t.value,m:f.m.value.trim(),date:new Date().toISOString()};DB.tickets.unshift(tk);save();f.reset();toast(t("t_tk")+": "+tk.id)};
$("#heroArt").innerHTML=courtSvg("padel");
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.08});$$(".rv").forEach(e=>io.observe(e));
const so=new IntersectionObserver(es=>es.forEach(x=>{if(!x.isIntersecting)return;const n=+x.target.dataset.n;let c=0;const id=setInterval(()=>{c=Math.min(n,c+n/50);x.target.textContent=Math.round(c).toLocaleString();if(c>=n)clearInterval(id)},25);so.unobserve(x.target)}));$$("[data-n]").forEach(e=>so.observe(e));
const nv=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting)$$(".links a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+x.target.id))}),{rootMargin:"-45% 0px -50% 0px"});$$("main section[id]").forEach(s=>nv.observe(s));
document.documentElement.dataset.theme=theme;render();
</script>
</body>
</html>
